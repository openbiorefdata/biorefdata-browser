name: Sync from CVMFS to S3
on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'Bucket Name'
        required: true
        default: 'biorefdata'
      endpoint:
        description: 'S3 endpoint'
        required: true
        default: 'https://s3-ap-southeast-2.amazonaws.com'
      region:
        description: 'S3 region'
        required: true
        default: 'ap-southeast-2'

  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-dynamic-matrix:
    runs-on: ubuntu-latest
    container:
      image: cloudve/mirror_cvmfs_s3:latest
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_BUCKET_NAME: ${{ github.event.inputs.bucket_name || 'biorefdata' }}
        AWS_ENDPOINT: ${{ github.event.inputs.endpoint || 'https://s3-ap-southeast-2.amazonaws.com' }}
        AWS_REGION: ${{ github.event.inputs.region || 'ap-southeast-2' }}
      options: --privileged
    steps:
      - id: mount_cvmfs
        run: /app/mount.sh
      - id: set-matrix
        shell: bash
        run: |
          paths="$(/app/matrix.sh)"
          n="$(printf '%s' "$paths" | jq 'length')"
          # A GitHub Actions matrix generates at most 256 jobs per run. There are
          # more sync paths than that, so batch them: pick the smallest batch size
          # that keeps the job count <= 200, then emit one space-joined path list
          # per batch. The mirror job loops over the paths within its batch.
          size="$(( (n + 199) / 200 ))"
          [ "$size" -lt 1 ] && size=1
          matrix="$(printf '%s' "$paths" | jq -c --argjson s "$size" \
            '[range(0; length; $s) as $i | .[$i:$i+$s] | join(" ")]')"
          printf 'path-matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Show matrix
        run: echo "The matrix is ${{ steps.set-matrix.outputs.path-matrix }}"
    outputs:
      path-matrix: ${{ steps.set-matrix.outputs.path-matrix }}
  mirror-cvmfs-to-s3:
    needs: build-dynamic-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.build-dynamic-matrix.outputs.path-matrix) }}
    container:
      image: cloudve/mirror_cvmfs_s3:latest
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_BUCKET_NAME: ${{ github.event.inputs.bucket_name || 'biorefdata' }}
        AWS_ENDPOINT: ${{ github.event.inputs.endpoint || 'https://s3-ap-southeast-2.amazonaws.com' }}
        AWS_REGION: ${{ github.event.inputs.region || 'ap-southeast-2' }}
      options: --privileged
    steps:
      - name: Run mirroring script within container
        shell: bash
        run: |
          # Each matrix entry is a space-separated batch of paths. sync.sh handles
          # one path and (re)mounts s3fs on /opt/s3fs itself, so unmount any stale
          # mount between paths to keep each mount clean. Keep going if one path
          # fails (matches fail-fast: false) and fail the job if any path failed.
          status=0
          for path in ${{ matrix.chunk }}; do
            echo "::group::Mirroring ${path}"
            if mountpoint -q /opt/s3fs; then
              fusermount -u /opt/s3fs || umount -l /opt/s3fs
            fi
            if ! /app/sync.sh "${path}"; then
              echo "::error::sync failed for ${path}"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"
